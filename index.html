<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Amarres - Pro</title>
    <link rel="icon" href="icono.png" type="image/png">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Registro de Amarres","short_name":"Amarres","start_url":"./","display":"standalone","background_color":"%23ffffff","icons":[{"src":"icono.png","sizes":"192x192","type":"image/png"}]}'>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .modal-bg { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-50 p-4">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border-t-4 border-sky-500">
        <h2 class="text-2xl font-bold mb-6 text-sky-600 text-center">Registro de Amarres por Obra o Proyecto</h2>

        <div>
            <!-- Datos Fijos -->
            <div class="bg-sky-50 p-4 rounded-lg mb-6 border border-sky-100">
                <h3 class="font-bold text-sky-800 mb-3 text-xs uppercase tracking-wide border-b border-sky-200 pb-1">Información Técnica Fija</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div class="md:col-span-2 bg-yellow-100 p-2 rounded border border-yellow-300">
                        <label class="block text-[11px] font-extrabold text-yellow-900">Obra / Proyecto</label>
                        <input type="text" id="transformador" placeholder="Ej: Obra La Candelaria" class="w-full border p-1 rounded text-xs bg-white text-gray-900 font-bold" oninput="verificarCambioObra()" onchange="verificarCambioObra(); guardarFijos();" list="listaObras">
                        <datalist id="listaObras"></datalist>
                    </div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Departamento</label><input type="text" id="departamento" value="Bolívar" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Ciudad</label><input type="text" id="ciudad" value="Magangué" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Barrio</label><input type="text" id="barrio" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Delegación</label><input type="text" id="delegacion" value="Bolívar Sur" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Tipo Proyecto</label><input type="text" id="tipoProyecto" value="Red TD" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Matrícula MT (Instalada Nueva)</label><input type="text" id="matriculaMT" placeholder="Ej: MT-Nueva-01" class="w-full border p-1 rounded text-xs bg-white text-gray-900 font-bold" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">TP</label><input type="text" id="tp" value="TP 01" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">MAC</label><input type="text" id="mac" inputmode="numeric" pattern="[0-9]*" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">TC</label><input type="text" id="tc" value="300/5" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Tipo Punto Medida</label><input type="text" id="tipoPuntoMedida" value="Usuario" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Tipo Actividad</label><input type="text" id="tipoActividad" value="Residencial" class="w-full border p-1 rounded text-xs bg-white text-gray-900" onchange="guardarFijos()"></div>
                </div>
            </div>

            <!-- Datos Usuario -->
            <div class="bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200">
                <h3 class="font-bold text-gray-600 mb-3 text-xs uppercase tracking-wide border-b border-gray-200 pb-1">Datos del Usuario</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label class="block text-xs font-semibold">Serie Medidor</label><input type="text" id="serieMedidor" inputmode="numeric" pattern="[0-9]*" oninput="soloNumeros(this)" class="w-full border p-2 rounded bg-white text-gray-900"></div>
                    <div><label class="block text-xs font-semibold">Tipo Medidor</label>
                        <select id="tipoMedidor" class="w-full border p-2 rounded bg-white text-gray-900">
                            <option>Monofasico Bifilar 1F2H</option>
                            <option>Monofasico Trifilar 1F3H</option>
                            <option>Bifasico 2F3H</option>
                        </select>
                    </div>
                    <div><label class="block text-xs font-semibold">Marca</label><input type="text" id="marcaMedidor" value="Hexing" class="w-full border p-2 rounded bg-white text-gray-900"></div>
                    <div><label class="block text-xs font-semibold">NIC</label><input type="text" id="nic" inputmode="numeric" pattern="[0-9]*" oninput="soloNumeros(this)" class="w-full border p-2 rounded bg-white text-gray-900"></div>
                    <div><label class="block text-xs font-semibold">NIS</label><input type="text" id="nis" inputmode="numeric" pattern="[0-9]*" oninput="soloNumeros(this)" class="w-full border p-2 rounded bg-white text-gray-900"></div>
                    <div><label class="block text-xs font-semibold">Nombre Cliente</label><input type="text" id="nombreCliente" class="w-full border p-2 rounded bg-white text-gray-900"></div>
                    <div><label class="block text-xs font-semibold">Dirección</label><input type="text" id="direccionCliente" class="w-full border p-2 rounded bg-white text-gray-900"></div>
                    <div><label class="block text-xs font-semibold">OBS</label><input type="text" id="obs" inputmode="numeric" pattern="[0-9]*" oninput="soloNumeros(this)" class="w-full border p-2 rounded bg-white text-gray-900"></div>
                </div>
            </div>

            <button type="button" onclick="guardarRegistro()" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition-colors shadow-md mb-4">
                Guardar Registro
            </button>
        </div>

        <!-- SECCIÓN DE REGISTROS CON SCROLL INDEPENDIENTE -->
        <div class="border-t pt-4 mt-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Registros Guardados: <span id="contador" class="text-sky-600">0</span></h3>
                <input type="text" id="filtroTabla" placeholder="🔍 Filtrar registros..." class="border p-1.5 rounded text-xs w-48 bg-white text-gray-900" oninput="renderizar()">
            </div>
            
            <div class="overflow-y-auto border border-gray-200 rounded-lg p-2 bg-gray-50" style="max-height: 250px;">
                <table class="w-full text-sm border-collapse" id="tablaAmarres"></table>
            </div>
            
            <button onclick="prepararExportacion()" class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 shadow">Descargar Excel (Obra Actual)</button>
            
            <button onclick="prepararModalEliminacion()" class="mt-2 w-full bg-red-100 text-red-600 py-2.5 rounded-lg font-bold hover:bg-red-200 border border-red-200 transition-colors text-xs shadow-sm">
                🗑️ Opciones de Borrado...
            </button>
        </div>
    </div>

    <!-- Modales -->
    <div id="modalEdicion" class="fixed inset-0 modal-bg hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg border-t-8 border-green-500 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg mb-4 text-green-600">Modificar Registro</h3>
            <input type="hidden" id="editIndex">
            <div id="camposEdicion" class="grid grid-cols-1 gap-3"></div>
            <div class="flex gap-2 mt-6">
                <button onclick="guardarEdicion()" class="flex-1 bg-green-600 text-white py-3 rounded font-bold hover:bg-green-700 shadow">Actualizar</button>
                <button onclick="cerrarModal()" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded font-bold hover:bg-gray-400">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalExportarMT" class="fixed inset-0 modal-bg hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md border-t-8 border-green-600">
            <h3 class="font-bold text-lg mb-2 text-green-700">Seleccionar Matrícula MT a Exportar</h3>
            <select id="selectMTEnd" class="w-full p-2 border rounded bg-white text-gray-900 text-sm font-bold mb-4"></select>
            <div class="flex gap-2">
                <button onclick="ejecutarExportacionExcel()" class="flex-1 bg-green-600 text-white py-2.5 rounded font-bold hover:bg-green-700 text-xs shadow">Descargar Excel</button>
                <button onclick="cerrarModalExportarMT()" class="flex-1 bg-gray-200 text-gray-800 py-2.5 rounded font-bold hover:bg-gray-300 text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalEliminarOpciones" class="fixed inset-0 modal-bg hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md border-t-8 border-red-500">
            <h3 class="font-bold text-lg mb-2 text-red-600">Opciones de Borrado</h3>
            <select id="tipoBorrado" class="w-full p-2 border rounded bg-white text-gray-900 text-sm font-bold mb-3" onchange="cambiarTipoBorrado()">
                <option value="obra">Borrar solo la Obra actual en pantalla</option>
                <option value="mt">Borrar una Matrícula MT específica</option>
                <option value="todo">⚠️ Borrar TODO el sistema</option>
            </select>
            <div id="contenedorSelectMTDel" class="hidden mb-3">
                <select id="selectMTDel" class="w-full p-2 border rounded bg-white text-gray-900 text-sm font-bold"></select>
            </div>
            <div class="flex gap-2">
                <button onclick="ejecutarBorradoSelectivo()" class="flex-1 bg-red-600 text-white py-2.5 rounded font-bold hover:bg-red-700 text-xs shadow">Confirmar</button>
                <button onclick="cerrarModalEliminacion()" class="flex-1 bg-gray-200 text-gray-800 py-2.5 rounded font-bold hover:bg-gray-300 text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let amarres = JSON.parse(localStorage.getItem('amarres_data')) || [];
        let obraAnterior = "";
        
        window.addEventListener('DOMContentLoaded', () => {
            const fijosGuardados = JSON.parse(localStorage.getItem('amarres_fijos')) || {};
            const camposFijos = ['transformador','departamento','ciudad','barrio','delegacion','tipoProyecto','matriculaMT','tp','mac','tc','tipoPuntoMedida','tipoActividad'];
            camposFijos.forEach(c => {
                if(fijosGuardados[c] !== undefined && document.getElementById(c)) {
                    document.getElementById(c).value = fijosGuardados[c];
                }
            });
            obraAnterior = document.getElementById('transformador').value.trim();
            renderizar();
        });

        function verificarCambioObra() {
            const obraActual = document.getElementById('transformador').value.trim();
            if (obraActual !== obraAnterior) {
                // Limpiar campos específicos al cambiar de obra
                document.getElementById('barrio').value = '';
                document.getElementById('matriculaMT').value = '';
                document.getElementById('mac').value = '';
                document.getElementById('tp').value = '';
                document.getElementById('tc').value = '';
                
                obraAnterior = obraActual;
                guardarFijos();
            }
        }

        function guardarFijos() {
            const camposFijos = ['transformador','departamento','ciudad','barrio','delegacion','tipoProyecto','matriculaMT','tp','mac','tc','tipoPuntoMedida','tipoActividad'];
            let fijos = {};
            camposFijos.forEach(c => fijos[c] = document.getElementById(c).value);
            localStorage.setItem('amarres_fijos', JSON.stringify(fijos));
        }

        function soloNumeros(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        function guardarRegistro() {
            guardarFijos();
            const trafo = document.getElementById('transformador').value.trim();
            if(!trafo) {
                alert("Por favor, ingresa la Obra o Proyecto.");
                document.getElementById('transformador').focus();
                return;
            }

            const nuevoNic = document.getElementById('nic').value.trim();
            const nuevoNis = document.getElementById('nis').value.trim();
            const nuevaSerie = document.getElementById('serieMedidor').value.trim();

            if (nuevoNic !== '' && amarres.some(r => r.nic === nuevoNic)) {
                alert(`⚠️ El NIC "${nuevoNic}" ya se encuentra registrado.`);
                document.getElementById('nic').focus();
                return;
            }
            if (nuevoNis !== '' && amarres.some(r => r.nis === nuevoNis)) {
                alert(`⚠️ El NIS "${nuevoNis}" ya se encuentra registrado.`);
                document.getElementById('nis').focus();
                return;
            }
            if (nuevaSerie !== '' && amarres.some(r => r.serieMedidor === nuevaSerie)) {
                alert(`⚠️ La Serie de Medidor "${nuevaSerie}" ya se encuentra registrada.`);
                document.getElementById('serieMedidor').focus();
                return;
            }

            const campos = ['transformador','departamento','ciudad','barrio','delegacion','tipoProyecto','matriculaMT','tp','mac','tc','tipoPuntoMedida','tipoActividad','serieMedidor','tipoMedidor','marcaMedidor','nic','nis','nombreCliente','direccionCliente','obs'];
            let item = {};
            campos.forEach(c => item[c] = document.getElementById(c).value);
            amarres.push(item);
            localStorage.setItem('amarres_data', JSON.stringify(amarres));
            renderizar();
            
            const camposUsuario = ['serieMedidor', 'nic', 'nis', 'nombreCliente', 'direccionCliente', 'obs'];
            camposUsuario.forEach(c => document.getElementById(c).value = '');
            document.getElementById('serieMedidor').focus();
        }

        function renderizar() {
            const filtroTexto = document.getElementById('filtroTabla').value.trim().toLowerCase();
            const table = document.getElementById('tablaAmarres');
            table.innerHTML = '';
            
            const filtrados = amarres.map((item, originalIndex) => ({ item, originalIndex }))
                                    .filter(({ item }) => {
                                        if(!filtroTexto) return true;
                                        return Object.values(item).some(val => String(val).toLowerCase().includes(filtroTexto));
                                    });
            
            document.getElementById('contador').innerText = filtrados.length;

            const obrasUnicas = [...new Set(amarres.map(item => item.transformador).filter(Boolean))];
            const dataList = document.getElementById('listaObras');
            dataList.innerHTML = '';
            obrasUnicas.forEach(obra => {
                dataList.innerHTML += `<option value="${obra}">`;
            });

            if (filtrados.length === 0) {
                table.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-gray-400 text-xs">No hay registros encontrados.</td></tr>`;
                return;
            }
            
            filtrados.forEach(({ item: r, originalIndex }) => {
                table.innerHTML += `<tr class="border-b bg-white hover:bg-gray-100">
                    <td class="py-3 px-2">
                        <div class="font-bold text-sky-800">NIC: ${r.nic || 'S/N'} | Med: ${r.serieMedidor || 'S/N'}</div>
                        <div class="text-xs text-gray-500">${r.nombreCliente || 'Sin nombre'} (Obra: <b>${r.transformador}</b> | MT: <b>${r.matriculaMT || 'N/A'}</b>)</div>
                    </td>
                    <td class="text-right whitespace-nowrap px-2">
                        <button onclick="abrirModal(${originalIndex})" class="text-sky-600 font-bold mr-3 hover:underline text-xs">Modificar</button>
                        <button onclick="eliminar(${originalIndex})" class="text-red-600 font-bold hover:underline text-xs">Eliminar</button>
                    </td>
                </tr>`;
            });
        }

        function prepararModalEliminacion() {
            if (amarres.length === 0) { alert("No hay registros."); return; }
            document.getElementById('tipoBorrado').value = 'obra';
            cambiarTipoBorrado();
            const mtUnicas = [...new Set(amarres.map(item => item.matriculaMT || 'SIN MATRICULA MT'))];
            const selectMT = document.getElementById('selectMTDel');
            selectMT.innerHTML = '';
            mtUnicas.forEach(mt => selectMT.innerHTML += `<option value="${mt}">${mt}</option>`);
            document.getElementById('modalEliminarOpciones').classList.remove('hidden');
        }

        function cambiarTipoBorrado() {
            const tipo = document.getElementById('tipoBorrado').value;
            const contenedorMT = document.getElementById('contenedorSelectMTDel');
            if (tipo === 'mt') contenedorMT.classList.remove('hidden');
            else contenedorMT.classList.add('hidden');
        }

        function cerrarModalEliminacion() { document.getElementById('modalEliminarOpciones').classList.add('hidden'); }

        function ejecutarBorradoSelectivo() {
            const tipo = document.getElementById('tipoBorrado').value;
            const obraActual = document.getElementById('transformador').value.trim().toLowerCase();

            if (tipo === 'todo' && confirm('⚠️ ¿Borrar ABSOLUTAMENTE TODO el sistema?')) {
                amarres = [];
                localStorage.removeItem('amarres_data');
                renderizar();
                cerrarModalEliminacion();
            } else if (tipo === 'obra' && confirm(`¿Borrar obra actual?`)) {
                amarres = amarres.filter(item => !(item.transformador && item.transformador.toLowerCase().includes(obraActual)));
                localStorage.setItem('amarres_data', JSON.stringify(amarres));
                renderizar();
                cerrarModalEliminacion();
            } else if (tipo === 'mt') {
                const mtSel = document.getElementById('selectMTDel').value;
                amarres = amarres.filter(item => (item.matriculaMT || 'SIN MATRICULA MT') !== mtSel);
                localStorage.setItem('amarres_data', JSON.stringify(amarres));
                renderizar();
                cerrarModalEliminacion();
            }
        }

        function abrirModal(i) {
            const r = amarres[i];
            document.getElementById('editIndex').value = i;
            document.getElementById('camposEdicion').innerHTML = `
                <div><label class="text-xs font-bold">Obra</label><input id="e_transformador" class="w-full p-2 border rounded text-xs font-bold bg-white text-gray-900" value="${r.transformador || ''}"></div>
                <div><label class="text-xs font-bold">Matrícula MT</label><input id="e_matriculaMT" class="w-full p-2 border rounded text-xs font-bold bg-white text-gray-900" value="${r.matriculaMT || ''}"></div>
                <div><label class="text-xs font-bold">Serie Medidor</label><input id="e_serieMedidor" class="w-full p-2 border rounded text-xs bg-white text-gray-900" value="${r.serieMedidor || ''}"></div>
                <div><label class="text-xs font-bold">NIC</label><input id="e_nic" class="w-full p-2 border rounded text-xs bg-white text-gray-900" value="${r.nic || ''}"></div>
                <div><label class="text-xs font-bold">NIS</label><input id="e_nis" class="w-full p-2 border rounded text-xs bg-white text-gray-900" value="${r.nis || ''}"></div>
                <div><label class="text-xs font-bold">Nombre Cliente</label><input id="e_nombreCliente" class="w-full p-2 border rounded text-xs bg-white text-gray-900" value="${r.nombreCliente || ''}"></div>
                <div><label class="text-xs font-bold">Dirección</label><input id="e_direccionCliente" class="w-full p-2 border rounded text-xs bg-white text-gray-900" value="${r.direccionCliente || ''}"></div>
            `;
            document.getElementById('modalEdicion').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modalEdicion').classList.add('hidden'); }

        function guardarEdicion() {
            const i = document.getElementById('editIndex').value;
            amarres[i].transformador = document.getElementById('e_transformador').value;
            amarres[i].matriculaMT = document.getElementById('e_matriculaMT').value;
            amarres[i].serieMedidor = document.getElementById('e_serieMedidor').value;
            amarres[i].nic = document.getElementById('e_nic').value;
            amarres[i].nis = document.getElementById('e_nis').value;
            amarres[i].nombreCliente = document.getElementById('e_nombreCliente').value;
            amarres[i].direccionCliente = document.getElementById('e_direccionCliente').value;
            localStorage.setItem('amarres_data', JSON.stringify(amarres));
            renderizar();
            cerrarModal();
        }

        function eliminar(i) {
            if(confirm('¿Borrar registro?')) {
                amarres.splice(i, 1);
                localStorage.setItem('amarres_data', JSON.stringify(amarres));
                renderizar();
            }
        }

        function prepararExportacion() {
            const obraActual = document.getElementById('transformador').value.trim().toLowerCase();
            const filtrados = amarres.filter(item => !obraActual || (item.transformador && item.transformador.toLowerCase().includes(obraActual)));
            if (filtrados.length === 0) { alert("No hay registros para exportar."); return; }
            const mtUnicas = [...new Set(filtrados.map(item => item.matriculaMT || 'SIN MATRICULA MT'))];
            const select = document.getElementById('selectMTEnd');
            select.innerHTML = '<option value="TODAS">-- Todas las Matrículas MT --</option>';
            mtUnicas.forEach(mt => select.innerHTML += `<option value="${mt}">${mt}</option>`);
            document.getElementById('modalExportarMT').classList.remove('hidden');
        }

        function cerrarModalExportarMT() { document.getElementById('modalExportarMT').classList.add('hidden'); }

        function ejecutarExportacionExcel() {
            const obraActual = document.getElementById('transformador').value.trim().toLowerCase();
            const mtSeleccionada = document.getElementById('selectMTEnd').value;
            const filtrados = amarres.filter(item => {
                const coincideObra = !obraActual || (item.transformador && item.transformador.toLowerCase().includes(obraActual));
                if (!coincideObra) return false;
                if (mtSeleccionada === 'TODAS') return true;
                return (item.matriculaMT || 'SIN MATRICULA MT') === mtSeleccionada;
            });

            const datosExportar = filtrados.map((item, idx) => ({
                "#": idx + 1,
                "Obra / Proyecto": item.transformador || '',
                "Departamento": item.departamento || '',
                "Ciudad": item.ciudad || '',
                "Barrio": item.barrio || '',
                "Delegación": item.delegacion || '',
                "Tipo Proyecto": item.tipoProyecto || '',
                "Matrícula MT": item.matriculaMT || '',
                "TP": item.tp || '',
                "MAC": item.mac || '',
                "TC": item.tc || '',
                "Tipo Punto Medida": item.tipoPuntoMedida || '',
                "Tipo Actividad": item.tipoActividad || '',
                "Serie Medidor": item.serieMedidor || '',
                "Tipo Medidor": item.tipoMedidor || '',
                "Marca": item.marcaMedidor || '',
                "NIC": item.nic || '',
                "NIS": item.nis || '',
                "Nombre Cliente": item.nombreCliente || '',
                "Dirección": item.direccionCliente || '',
                "OBS": item.obs || ''
            }));

            const worksheet = XLSX.utils.json_to_sheet(datosExportar);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Amarres");
            cerrarModalExportarMT();
            XLSX.writeFile(workbook, `Reporte_Amarres.xlsx`);
        }
    </script>
