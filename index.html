<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Amarres - Pro</title>
    
    <!-- PWA: Configuración de App Instalable -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Registro de Amarres Pro","short_name":"Amarres Pro","start_url":"./","display":"standalone","background_color":"%23ffffff","theme_color":"%230284c7","icons":[{"src":"https://img.icons8.com/color/192/clipboard.png","sizes":"192x192","type":"image/png"},{"src":"https://img.icons8.com/color/512/clipboard.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#0284c7">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/clipboard.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/clipboard.png">
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .modal-bg { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-50 p-4">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border-t-4 border-sky-500">
        <!-- Título con icono -->
        <div class="flex items-center justify-center gap-2 mb-6">
            <img src="https://img.icons8.com/color/48/clipboard.png" alt="Planillero" class="w-8 h-8">
            <h2 class="text-2xl font-bold text-sky-600 text-center">Registro de Amarres Pro</h2>
        </div>

        <form id="amarreForm">
            <div class="bg-sky-50 p-4 rounded-lg mb-6 border border-sky-100">
                <h3 class="font-bold text-sky-800 mb-3 text-xs uppercase tracking-wide border-b border-sky-200 pb-1">Información Técnica</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-extrabold text-yellow-900">Obra / Proyecto</label>
                        <input type="text" id="transformador" placeholder="Ej: Obra La Candelaria" required class="w-full border p-1 rounded text-xs bg-white font-bold" oninput="renderizar()" list="listaObras">
                        <datalist id="listaObras"></datalist>
                    </div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Ciudad</label><input type="text" id="ciudad" value="Magangué" class="w-full border p-1 rounded text-xs bg-white"></div>
                    <div><label class="block text-[10px] font-bold text-sky-900">Matrícula MT</label><input type="text" id="matriculaMT" class="w-full border p-1 rounded text-xs bg-white font-bold"></div>
                </div>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200">
                <h3 class="font-bold text-gray-600 mb-3 text-xs uppercase tracking-wide border-b border-gray-200 pb-1">Datos del Usuario</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label class="block text-xs font-semibold">NIC</label><input type="text" id="nic" class="w-full border p-2 rounded bg-white"></div>
                    <div><label class="block text-xs font-semibold">NIS</label><input type="text" id="nis" class="w-full border p-2 rounded bg-white"></div>
                    <div><label class="block text-xs font-semibold">Serie Medidor</label><input type="text" id="serieMedidor" class="w-full border p-2 rounded bg-white"></div>
                    <div class="md:col-span-3"><label class="block text-xs font-semibold">Nombre Cliente</label><input type="text" id="nombreCliente" class="w-full border p-2 rounded bg-white"></div>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition-colors shadow-md">Guardar Registro</button>
        </form>

        <div class="border-t pt-4 mt-6">
            <h3 class="text-lg font-bold mb-4">Registros: <span id="contador" class="text-sky-600">0</span></h3>
            <div class="overflow-y-auto border border-gray-200 rounded-lg p-2 bg-gray-50" style="max-height: 250px;">
                <table class="w-full text-sm" id="tablaAmarres"></table>
            </div>
            <button onclick="prepararExportacion()" class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">Descargar Excel</button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let amarres = JSON.parse(localStorage.getItem('amarres_data')) || [];
        
        // Registro de PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",()=>{});');
        }

        document.getElementById('amarreForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const item = {
                transformador: document.getElementById('transformador').value,
                ciudad: document.getElementById('ciudad').value,
                matriculaMT: document.getElementById('matriculaMT').value,
                nic: document.getElementById('nic').value,
                nis: document.getElementById('nis').value,
                serieMedidor: document.getElementById('serieMedidor').value,
                nombreCliente: document.getElementById('nombreCliente').value
            };
            amarres.push(item);
            localStorage.setItem('amarres_data', JSON.stringify(amarres));
            renderizar();
            this.reset();
        });

        function renderizar() {
            const obra = document.getElementById('transformador').value.toLowerCase();
            const table = document.getElementById('tablaAmarres');
            table.innerHTML = '';
            const filtrados = amarres.filter(i => !obra || i.transformador.toLowerCase().includes(obra));
            document.getElementById('contador').innerText = filtrados.length;
            
            filtrados.forEach((r, idx) => {
                table.innerHTML += `<tr class="border-b bg-white">
                    <td class="py-2 px-1 text-xs"><b>${r.nombreCliente}</b><br>NIC: ${r.nic}</td>
                    <td class="text-right px-1"><button onclick="eliminar(${idx})" class="text-red-500 font-bold">🗑️</button></td>
                </tr>`;
            });
        }

        function eliminar(i) { if(confirm('¿Borrar?')) { amarres.splice(i, 1); localStorage.setItem('amarres_data', JSON.stringify(amarres)); renderizar(); } }

        function prepararExportacion() {
            const ws = XLSX.utils.json_to_sheet(amarres);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Amarres");
            XLSX.writeFile(wb, "Reporte_Amarres.xlsx");
        }

        renderizar();
    </script>
</body>
</html>
