<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Amarres</title>
    
    <!-- Configuración PWA para instalación en pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="icon" href="https://img.icons8.com/color/48/clipboard.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/clipboard.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Registro de Amarres","short_name":"Amarres","start_url":"./","display":"standalone","background_color":"%23ffffff","icons":[{"src":"https://img.icons8.com/color/192/clipboard.png","sizes":"192x192","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-4">

    <!-- TU INTERFAZ ORIGINAL MANTENIDA -->
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600">
        <h2 class="text-xl font-bold mb-4 text-blue-800 text-center">Registro de Amarres por Obra</h2>
        
        <form id="amarreForm" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <input type="text" id="transformador" placeholder="Obra / Transformador" class="border p-2 rounded col-span-2 md:col-span-4" required>
            <input type="text" id="departamento" placeholder="Departamento" value="Bolívar" class="border p-2 rounded">
            <input type="text" id="ciudad" placeholder="Ciudad" value="Magangué" class="border p-2 rounded">
            <input type="text" id="barrio" placeholder="Barrio" class="border p-2 rounded">
            <input type="text" id="delegacion" placeholder="Delegación" class="border p-2 rounded">
            <input type="text" id="matriculaMT" placeholder="Matrícula MT" class="border p-2 rounded">
            <input type="text" id="serieMedidor" placeholder="Serie Medidor" class="border p-2 rounded">
            <input type="text" id="nic" placeholder="NIC" class="border p-2 rounded">
            <input type="text" id="nis" placeholder="NIS" class="border p-2 rounded">
            <button type="submit" class="col-span-2 md:col-span-4 bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">Guardar</button>
        </form>

        <div class="mt-6">
            <table class="w-full border-collapse border mt-4" id="tablaAmarres">
                <thead><tr class="bg-gray-200"><th class="border p-2">Obra</th><th class="border p-2">Serie</th><th class="border p-2">NIC</th></tr></thead>
                <tbody></tbody>
            </table>
            <button onclick="descargarExcel()" class="mt-4 bg-green-600 text-white p-2 rounded w-full font-bold">Descargar Excel</button>
        </div>
    </div>

    <script>
        // Lógica para manejar los datos y el almacenamiento local
        const form = document.getElementById('amarreForm');
        let registros = JSON.parse(localStorage.getItem('amarres')) || [];

        function renderizar() {
            const tbody = document.querySelector('#tablaAmarres tbody');
            tbody.innerHTML = '';
            registros.forEach((item, index) => {
                tbody.innerHTML += `<tr><td class='border p-2'>${item.transformador}</td><td class='border p-2'>${item.serieMedidor}</td><td class='border p-2'>${item.nic}</td></tr>`;
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const nuevo = {
                transformador: document.getElementById('transformador').value,
                serieMedidor: document.getElementById('serieMedidor').value,
                nic: document.getElementById('nic').value
            };
            registros.push(nuevo);
            localStorage.setItem('amarres', JSON.stringify(registros));
            renderizar();
            form.reset();
        });

        function descargarExcel() {
            const ws = XLSX.utils.json_to_sheet(registros);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Amarres");
            XLSX.writeFile(wb, "Registro_Amarres.xlsx");
        }

        renderizar();
    </script>
</body>
</html>
